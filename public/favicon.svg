<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Rich Crimson-Ruby Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="45%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <!-- Radiant Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#450A0A" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Hexagonal Tech Shield Container -->
  <!-- Rounded corner hexagon: Top, Top-Right, Bottom-Right, Bottom, Bottom-Left, Top-Left -->
  <path d="M32 4L56 16V44L32 58L8 44V16L32 4Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldRim)" 
        stroke-width="2.5" 
        stroke-linejoin="round"/>

  <!-- Inner Subtle Hexagon Inset -->
  <path d="M32 8L52 18V42L32 54L12 42V18L32 8Z" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="1" 
        stroke-opacity="0.18" 
        stroke-linejoin="round"/>

  <!-- Main Symbol Group with Soft Drop Shadow -->
  <g filter="url(#softGlow)">
    <!-- Bold Tech "T" (Pure Optic White) -->
    <!-- Top Bar -->
    <path d="M16 19C16 17.8954 16.8954 17 18 17H40C41.1046 17 42 17.8954 42 19V24C42 25.1046 41.1046 26 40 26H34V46C34 47.1046 33.1046 48 32 48H26C24.8954 48 24 47.1046 24 46V26H18C16.8954 26 16 25.1046 16 24V19Z" 
          fill="#FFFFFF"/>

    <!-- Dynamic "GO" Chevron (Vibrant Gold) pointing Forward -->
    <path d="M38 27L48 35L38 43L42 47L56 35L42 23L38 27Z" 
          fill="url(#goldAccent)"/>

    <!-- Energy Tech Core Node -->
    <circle cx="29" cy="21.5" r="1.8" fill="#DC2626"/>
  </g>
</svg>
