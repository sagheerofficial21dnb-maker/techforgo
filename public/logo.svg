<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <!-- Rich Crimson-Ruby Gradient -->
    <linearGradient id="shieldGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="45%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <!-- Radiant Gold Rim Gradient -->
    <linearGradient id="goldRimL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccentL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="softGlowL" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#450A0A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left: Hexagonal Tech Shield Emblem -->
  <g transform="translate(4, 4)">
    <path d="M28 2L50 13V39L28 52L6 39V13L28 2Z" 
          fill="url(#shieldGradL)" 
          stroke="url(#goldRimL)" 
          stroke-width="2.2" 
          stroke-linejoin="round"/>

    <path d="M28 5.5L46.5 15V37L28 48L9.5 37V15L28 5.5Z" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="0.8" 
          stroke-opacity="0.2" 
          stroke-linejoin="round"/>

    <g filter="url(#softGlowL)">
      <!-- Tech T in White -->
      <path d="M14 16C14 15.1 14.8 14.3 15.7 14.3H35.3C36.2 14.3 37 15.1 37 16V20.3C37 21.2 36.2 22 35.3 22H30V38.5C30 39.4 29.2 40.2 28.3 40.2H23C22.1 40.2 21.3 39.4 21.3 38.5V22H15.7C14.8 22 14 21.2 14 20.3V16Z" 
            fill="#FFFFFF"/>

      <!-- Dynamic GO Chevron in Gold -->
      <path d="M33 22.5L42 29.5L33 36.5L36.5 40L49 29.5L36.5 19L33 22.5Z" 
            fill="url(#goldAccentL)"/>

      <!-- Tech Core Dot -->
      <circle cx="25.5" cy="18.2" r="1.5" fill="#DC2626"/>
    </g>
  </g>

  <!-- Right: Typography -->
  <!-- Wordmark -->
  <text x="68" y="37" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="-0.03em">
    <tspan fill="#991B1B">TECH</tspan><tspan fill="#1A1A1A">FORGO</tspan>
  </text>

  <!-- Modern Pulse Status Dot -->
  <circle cx="236" cy="27" r="3.5" fill="#DC2626"/>
  <circle cx="236" cy="27" r="6" fill="#EF4444" opacity="0.3"/>

  <!-- Subtitle Tagline -->
  <text x="69" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="9" letter-spacing="0.16em" fill="#7F1D1D" text-transform="uppercase">
    Technology &amp; Computing Insights
  </text>
</svg>
